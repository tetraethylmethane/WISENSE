; ESP32-S3 N16R8 -- on-device activity recognition from Wi-Fi CSI.
;
; PlatformIO builds this as a plain ESP-IDF project (framework = espidf):
; the same CMakeLists.txt, main/, sdkconfig.defaults and idf_component.yml
; that `idf.py build` would use. espressif32 6.12.0 bundles ESP-IDF 5.5.
;
;   pio run -t upload -t monitor
;   pio run -t menuconfig            ; WiSense HAR options (arena, RX pin, baud)
;
; Run `python -m wisense.export <run>` first -- it writes main/generated/.

[platformio]
src_dir = main

[env:esp32s3_n16r8]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
; N16R8: 16 MB quad flash + 8 MB octal PSRAM (PSRAM mode is in sdkconfig.defaults)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
