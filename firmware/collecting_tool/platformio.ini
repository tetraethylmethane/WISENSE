; PlatformIO build of the authors' ESP32 CSI Web Collecting Tool.
;
; This file and sdkconfig.defaults belong in the tool's own directory:
;   Embedded_WiFi_Sensing/ESP32_CSI_Web_Collecting_Tool/
; `python -m tools.install_collecting_tool` copies them there. Flash the same
; build to both boards; each is set to Tx or Rx afterwards in its web form.
;
;   pio run -t upload -t monitor
;
; The web form is compiled in with EMBED_FILES in main/CMakeLists.txt.
; PlatformIO additionally needs the same files listed below, or the
; embedded-file symbols are missing at link time.

[platformio]
src_dir = main

[env:esp32]
platform = espressif32@6.12.0
framework = espidf
; Any classic ESP32 dev board (the paper used ESP32-DevKitC-VIE). 4 MB is
; the smallest flash the 2 MB app partition in partitions.csv fits.
board = esp32dev
board_upload.flash_size = 4MB
; PlatformIO sizes and flashes from this, not from the sdkconfig partition
; setting -- without it the 1.4 MB app fails against the default 1 MB slot.
board_build.partitions = partitions.csv
monitor_speed = 115200
board_build.embed_files =
    main/webpage/app.js
    main/webpage/favicon.ico
    main/webpage/index.html
    main/webpage/jquery-3.3.1.min.js
    main/webpage/bootstrap.min.css
    main/webpage/esp32.png
